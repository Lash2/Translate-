export default function App() {
  // Navigation & App State
  const [activeScreen, setActiveScreen] = useState('dashboard'); // dashboard, bubble_settings, translator, screen_sim, languages, history, favorites, settings
  const [darkMode, setDarkMode] = useState(true);
  const [showBuildGuide, setShowBuildGuide] = useState(false);
  const [toastMessage, setToastMessage] = useState(null);

  // Android Permissions & Floating Bubble State
  const [overlayPermission, setOverlayPermission] = useState(true);
  const [screenCapturePermission, setScreenCapturePermission] = useState(true);
  const [bubbleEnabled, setBubbleEnabled] = useState(true);
  const [bubbleExpanded, setBubbleExpanded] = useState(false);

  // Bubble Appearance Settings
  const [bubbleSize, setBubbleSize] = useState(54); // px
  const [bubbleOpacity, setBubbleOpacity] = useState(95); // %
  const [edgeSnap, setEdgeSnap] = useState(true);
  const [bubbleTheme, setBubbleTheme] = useState(BUBBLE_THEMES[0]);

  // Bubble Drag Position (Relative to phone screen container)
  const phoneScreenRef = useRef(null);
  const [bubblePos, setBubblePos] = useState({ x: 285, y: 240 });
  const isDraggingRef = useRef(false);
  const dragStartRef = useRef({ startX: 0, startY: 0, initialX: 0, initialY: 0, moved: false });

  // Translation Engine State
  const [sourceLang, setSourceLang] = useState('auto');
  const [targetLang, setTargetLang] = useState('gu'); // Default Gujarati as in user prompt
  const [detectedLangCode, setDetectedLangCode] = useState('en');
  const [inputText, setInputText] = useState('How are you?');
  const [translatedText, setTranslatedText] = useState('તમે કેમ છો?');
  const [isTranslating, setIsTranslating] = useState(false);

  // Floating Mini-Window Translation State
  const [miniInputText, setMiniInputText] = useState('Hi');
  const [miniTranslatedText, setMiniTranslatedText] = useState('હાય');
  const [isMiniTranslating, setIsMiniTranslating] = useState(false);

  // Screen OCR Simulation State
  const [activeSimApp, setActiveSimApp] = useState('whatsapp');
  const [isScanningScreen, setIsScanningScreen] = useState(false);
  const [screenOcrResults, setScreenOcrResults] = useState(null); // { appId, items: [{ id, original, translated }] }

  // History, Favorites & Settings
  const [historyList, setHistoryList] = useState([
    { id: 'h1', sourceText: 'How are you?', translatedText: 'તમે કેમ છો?', sourceLang: 'en', targetLang: 'gu', timestamp: 'Just now', favorite: true },
    { id: 'h2', sourceText: 'Hi', translatedText: 'હાય', sourceLang: 'en', targetLang: 'gu', timestamp: '2 mins ago', favorite: false },
    { id: 'h3', sourceText: 'おはようございます', translatedText: 'સુપ્રભાત (Good Morning)', sourceLang: 'ja', targetLang: 'gu', timestamp: '15 mins ago', favorite: true },
  ]);
  const [languageSearch, setLanguageSearch] = useState('');
  const [historySearch, setHistorySearch] = useState('');
  const [ttsSpeed, setTtsSpeed] = useState(1.0);
  const [autoDetectEnabled, setAutoDetectEnabled] = useState(true);

  // Toast helper
  const triggerToast = useCallback((msg) => {
    setToastMessage(msg);
    setTimeout(() => {
      setToastMessage(prev => (prev === msg ? null : prev));
    }, 2600);
  }, []);

  // Copy helper
  const handleCopy = (text) => {
    if (!text) return;
    navigator.clipboard?.writeText(text);
    triggerToast('Copied to clipboard!');
  };

  // Text-to-Speech helper
  const handleSpeak = (text, langCode) => {
    if (!text || !('speechSynthesis' in window)) {
      triggerToast('TTS audio triggered');
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const langObj = LANGUAGES.find(l => l.code === langCode);
    if (langObj) utterance.lang = langObj.speechCode;
    utterance.rate = ttsSpeed;
    window.speechSynthesis.speak(utterance);
    triggerToast(`Speaking (${langObj?.name || langCode})...`);
  };

  // Save to History
  const addToHistory = useCallback((src, trans, sLang, tLang) => {
    if (!src.trim() || !trans.trim()) return;
    setHistoryList(prev => {
      // Avoid duplicate consecutive entries
      if (prev.length > 0 && prev[0].sourceText === src && prev[0].targetLang === tLang) {
        return prev;
      }
      const newItem = {
        id: Date.now().toString(),
        sourceText: src,
        translatedText: trans,
        sourceLang: sLang,
        targetLang: tLang,
        timestamp: 'Just now',
        favorite: false
      };
      return [newItem, ...prev.slice(0, 49)];
    });
  }, []);

  // Toggle Favorite
  const toggleFavorite = (id) => {
    setHistoryList(prev => prev.map(item =>
      item.id === id ? { ...item, favorite: !item.favorite } : item
    ));
  };

  // Debounced Real-time Translation for Full Text Translator
  useEffect(() => {
    if (!inputText.trim()) {
      setTranslatedText('');
      return;
    }
    const timer = setTimeout(async () => {
      setIsTranslating(true);
      const res = await translateWithGeminiAPI({
        text: inputText,
        sourceLang: autoDetectEnabled ? sourceLang : (sourceLang === 'auto' ? 'en' : sourceLang),
        targetLang
      });
      setTranslatedText(res.translatedText);
      setDetectedLangCode(res.detectedLang);
      setIsTranslating(false);
    }, 450);

    return () => clearTimeout(timer);
  }, [inputText, sourceLang, targetLang, autoDetectEnabled]);

  // Debounced Real-time Translation for Floating Bubble Window
  useEffect(() => {
    if (!miniInputText.trim()) {
      setMiniTranslatedText('');
      return;
    }
    const timer = setTimeout(async () => {
      setIsMiniTranslating(true);
      const res = await translateWithGeminiAPI({
        text: miniInputText,
        sourceLang: 'auto',
        targetLang
      });
      setMiniTranslatedText(res.translatedText);
      setDetectedLangCode(res.detectedLang);
      setIsMiniTranslating(false);
    }, 400);

    return () => clearTimeout(timer);
  }, [miniInputText, targetLang]);

  // Swap Languages
  const handleSwapLanguages = () => {
    const effectiveSource = sourceLang === 'auto' ? detectedLangCode : sourceLang;
    if (effectiveSource === targetLang) return;
    setSourceLang(targetLang);
    setTargetLang(effectiveSource);
    setInputText(translatedText);
    setTranslatedText(inputText);
    triggerToast('Languages swapped');
  };

  // ============================================================================
  // DRAGGABLE FLOATING BUBBLE LOGIC (Mouse + Touch)
  // ============================================================================
  const handlePointerDown = (e) => {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    isDraggingRef.current = true;
    dragStartRef.current = {
      startX: clientX,
      startY: clientY,
      initialX: bubblePos.x,
      initialY: bubblePos.y,
      moved: false
    };
  };

  useEffect(() => {
    const handlePointerMove = (e) => {
      if (!isDraggingRef.current || !phoneScreenRef.current) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const dx = clientX - dragStartRef.current.startX;
      const dy = clientY - dragStartRef.current.startY;

      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
        dragStartRef.current.moved = true;
      }

      const bounds = phoneScreenRef.current.getBoundingClientRect();
      const maxX = bounds.width - bubbleSize - 8;
      const maxY = bounds.height - bubbleSize - 68; // keep above bottom nav

      const nextX = Math.max(8, Math.min(maxX, dragStartRef.current.initialX + dx));
      const nextY = Math.max(36, Math.min(maxY, dragStartRef.current.initialY + dy));

      setBubblePos({ x: nextX, y: nextY });
    };

    const handlePointerUp = () => {
      if (!isDraggingRef.current) return;
      isDraggingRef.current = false;

      if (!dragStartRef.current.moved) {
        // It was a tap! Toggle floating window
        setBubbleExpanded(prev => !prev);
      } else if (edgeSnap && phoneScreenRef.current) {
        // Snap smoothly to left or right edge
        
